<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Orbital Glow Ring (Network / Outreach) -->
  <ellipse cx="32" cy="34" rx="22" ry="10" transform="rotate(-25 32 34)" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="3 3" opacity="0.65" />

  <!-- Speed Trail Lines -->
  <path d="M12 40 L24 35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M15 47 L28 41" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Main Origami Stealth Paper Airplane / Rocket -->
  <g filter="url(#glow)">
    <!-- Right wing -->
    <path d="M52 14 L24 37 L33 49 L52 14 Z" fill="#1d4ed8" />
    <!-- Left wing -->
    <path d="M52 14 L12 28 L24 37 L52 14 Z" fill="url(#planeGrad)" />
    <!-- Center fold -->
    <path d="M52 14 L24 37 L22 46 L30 40 L52 14 Z" fill="#38bdf8" />
  </g>

  <!-- Zero-Bounce Verification Checkmark Badge -->
  <circle cx="48" cy="48" r="8" fill="#10b981" stroke="#0f172a" stroke-width="2" />
  <path d="M44.5 48 L47 50.5 L51.5 45.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>