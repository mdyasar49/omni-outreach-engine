    <circle cx="42" cy="42" r="7" fill="#10b981" stroke="#0f172a" stroke-width="2" />
    <path d="M39 42 L41.2 44.2 L45 39.8" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Logo Typography -->
  <text x="74" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="url(#logoTextGrad)" letter-spacing="-0.5">OmniReach</text>
  <text x="74" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">COLD EMAIL AUTOMATION</text>
