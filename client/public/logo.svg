    <ellipse cx="28" cy="30" rx="19" ry="8" transform="rotate(-25 28 30)" stroke="url(#logoGlowGrad)" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.65" />
    <path d="M46 12 L21 32 L29 43 L46 12 Z" fill="#1d4ed8" />
